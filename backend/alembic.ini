# Alembic Configuration
# See: https://alembic.sqlalchemy.org/en/latest/

[alembic]
script_location = alembic
# Overridden at runtime by env.py → settings.database_url
# For local dev: postgresql+asyncpg://postgres:password@localhost:5432/seagrass
# For Supabase: postgresql+asyncpg://postgres.[REF]:[PASS]@aws-0-[REGION].pooler.supabase.com:6543/postgres
sqlalchemy.url = postgresql+asyncpg://postgres:password@localhost:5432/seagrass

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
