# ==============================================================================
# Seagrass AI — High-Performance Nginx Reverse Proxy & Load Balancer
# ==============================================================================
# Features:
# 1. Least-connection upstream load balancing across multiple FastAPI workers
# 2. Immutable 1-year caching for Vite hashed static assets (/assets/*)
# 3. Dynamic edge gzip compression for JSON, GeoJSON, JS, and CSS
# 4. Rate-limiting zones protecting compute-heavy inference endpoints
# 5. Security headers and WebSocket upgrade proxying
# ==============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # ── Performance Tuning ──────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    client_max_body_size 25M; # Support high-resolution quadrat field photos

    # ── Edge GZip Compression ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 500;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/geo+json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Rate Limiting Zones ─────────────────────────────────────────────────
    # Limit heavy YOLO inference & image uploads to 10 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=ai_inference:10m rate=10r/m;
    # General API rate limit (60 requests/minute per IP)
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;

    # ── Upstream FastAPI Application Servers (Load Balancing) ───────────────
    upstream seagrass_backend {
        least_conn; # Route to worker with fewest active connections
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen       80;
        listen  [::]:80;
        server_name  seagrass.ai www.seagrass.ai localhost;

        # Root directory for static web build (Vite dist)
        root   /var/www/seagrass/web/dist;
        index  index.html;

        # ── Security Headers ────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Hashed Static Assets (Vite Chunks) ──────────────────────────────
        # Vite generates content-hashed assets (e.g. index-CA3OWDzr.js)
        # Safe to cache indefinitely with immutable directive
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Favicon and static icons
        location ~* \.(ico|svg|png|jpg|jpeg|webp)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
            try_files $uri =404;
        }

        # ── Health Check (Bypasses Rate Limiter & Logs) ──────────────────────
        location /health {
            proxy_pass http://seagrass_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # ── AI Inference Upload Endpoint (Rate-Limited) ─────────────────────
        location /api/v1/detections/analyze {
            limit_req zone=ai_inference burst=5 nodelay;

            proxy_pass http://seagrass_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for ML inference
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ── Backend API Reverse Proxy ───────────────────────────────────────
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;

            proxy_pass http://seagrass_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
        }

        # ── Single Page Application (SPA) Routing ───────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Error pages
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
